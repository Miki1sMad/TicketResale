x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketresale-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ticketresale}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ticketresale}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ticketresale}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *default-logging

  postgres:
    image: postgres:18-alpine
    container_name: ticketresale-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketresale}
      POSTGRES_USER: ${POSTGRES_USER:-ticketresale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketresale}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketresale} -d ${POSTGRES_DB:-ticketresale}"]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: *default-logging

  redis:
    image: redis:alpine
    container_name: ticketresale-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: *default-logging

  mailpit:
    image: axllent/mailpit:latest
    container_name: ticketresale-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    <<: *default-logging

volumes:
  postgres_data:
  redis_data:
