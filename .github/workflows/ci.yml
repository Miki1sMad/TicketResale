name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and verify with Maven
        run: ./mvnw -B clean verify

      - name: Start Docker Compose environment
        run: |
          docker compose up -d --build
          echo "Waiting for TicketResale application to become ready..."
          for i in {1..60}; do
            if curl -s -f http://localhost:8080/api/v1/clubs > /dev/null 2>&1; then
              echo "Application is up and responding!"
              break
            fi
            sleep 2
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "tests_e2e/uv.lock"
          python-version: '3.14'

      - name: Run E2E Test Suite
        working-directory: tests_e2e
        run: |
          uv sync --frozen
          uv run pytest -v

      - name: Show docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Teardown Docker Compose
        if: always()
        run: docker compose down -v

  publish-ghcr:
    name: Build & Push Docker Image to GHCR
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

