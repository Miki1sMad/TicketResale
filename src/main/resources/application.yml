spring:
  application:
    name: TicketResale

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticketresale}
    username: ${SPRING_DATASOURCE_USERNAME:ticketresale}
    password: ${SPRING_DATASOURCE_PASSWORD:ticketresale}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    protocol: smtp

ticketresale:
  admin:
    email: ${ADMIN_EMAIL:admin@ticketresale.com}
    password: ${ADMIN_PASSWORD:Admin123!Safe}
    first-name: System
    last-name: Admin

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B597032723575}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
